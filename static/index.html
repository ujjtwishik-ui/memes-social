<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>MEMES</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --panel: #111;
      --line: #222;
      --line-strong: #333;
      --text: #e8e8e8;
      --muted: #666;
      --accent: #fff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    header {
      border-bottom: 1px solid var(--line);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 10;
    }
    header .logo {
      font-weight: 700;
      letter-spacing: 4px;
      font-size: 14px;
      text-transform: uppercase;
      flex: 1;
    }
    header .logo::before { content: "// "; color: var(--muted); }

    button {
      background: transparent;
      border: 1px solid var(--line-strong);
      color: var(--text);
      padding: 6px 12px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 11px;
      transition: all .1s;
    }
    button:hover { background: var(--text); color: var(--bg); border-color: var(--text); }
    button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
    button.primary:hover { background: transparent; color: var(--text); }

    main { max-width: 620px; margin: 0 auto; padding: 24px 16px 80px; }

    .tabs {
      display: flex;
      border-bottom: 1px solid var(--line);
      margin-bottom: 24px;
    }
    .tabs button {
      border: 0;
      border-bottom: 2px solid transparent;
      padding: 10px 16px;
      color: var(--muted);
      background: transparent;
    }
    .tabs button.active { color: var(--text); border-bottom-color: var(--text); }
    .tabs button:hover { background: transparent; color: var(--text); }

    .card {
      border: 1px solid var(--line);
      margin-bottom: 24px;
      background: var(--panel);
    }
    .card img {
      width: 100%;
      display: block;
      border-bottom: 1px solid var(--line);
      background: #000;
      max-height: 70vh;
      object-fit: contain;
    }
    .card .head {
      display: flex;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
    }
    .card .head .author { color: var(--text); }
    .card .caption {
      padding: 14px;
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
    }
    .card .actions {
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      border-top: 1px solid var(--line);
    }
    .card .actions button { padding: 5px 10px; }
    .card .actions .like.liked { border-color: var(--accent); color: var(--accent); }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.85);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }
    .modal.open { display: flex; }
    .modal .box {
      background: var(--bg);
      border: 1px solid var(--line-strong);
      padding: 24px;
      width: 100%;
      max-width: 380px;
    }
    .modal h3 {
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 12px;
      margin-bottom: 20px;
      color: var(--muted);
    }
    .modal h3::before { content: "> "; }

    input, textarea {
      width: 100%;
      background: transparent;
      border: 1px solid var(--line-strong);
      padding: 10px 12px;
      margin-bottom: 12px;
      outline: none;
      transition: border-color .1s;
    }
    input:focus, textarea:focus { border-color: var(--text); }
    textarea { min-height: 70px; resize: vertical; }
    input[type=file] {
      padding: 8px;
      cursor: pointer;
      color: var(--muted);
    }
    input[type=file]::file-selector-button {
      background: transparent;
      border: 1px solid var(--line-strong);
      color: var(--text);
      padding: 5px 10px;
      margin-right: 10px;
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    input[type=file]::file-selector-button:hover { background: var(--text); color: var(--bg); }

    .modal button { width: 100%; padding: 10px; margin-top: 4px; }
    .hint {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      margin-top: 12px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .hint:hover { color: var(--text); }
    .hidden { display: none !important; }
    .error {
      color: #ff5555;
      font-size: 11px;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      min-height: 14px;
    }
  </style>
</head>
<body>
<header>
  <div class="logo">memes</div>
  <button id="uploadBtn" class="primary hidden">+ загрузить</button>
  <button id="authBtn">войти</button>
</header>

<main>
  <div class="tabs">
    <button id="tabAll" class="active">все</button>
    <button id="tabMine" class="hidden">мои</button>
  </div>
  <div id="feed"></div>
</main>

<!-- auth modal -->
<div class="modal" id="authModal">
  <div class="box">
    <h3 id="authTitle">вход</h3>
    <div class="error" id="authError"></div>
    <input id="authUsername" placeholder="имя" autocomplete="username"/>
    <input id="authPassword" type="password" placeholder="пароль" autocomplete="current-password"/>
    <button class="primary" id="authSubmit">войти</button>
    <div class="hint" id="authSwitch">нет аккаунта → регистрация</div>
  </div>
</div>

<!-- upload modal -->
<div class="modal" id="uploadModal">
  <div class="box">
    <h3>новый мем</h3>
    <div class="error" id="uploadError"></div>
    <input type="file" id="memeFile" accept="image/*"/>
    <textarea id="memeCaption" placeholder="подпись (необязательно)" maxlength="500"></textarea>
    <button class="primary" id="uploadSubmit">опубликовать</button>
  </div>
</div>

<script>
const API = "";
let token = localStorage.getItem("token");
let me = null;

const $ = id => document.getElementById(id);
const headers = () => token ? { "Authorization": "Bearer " + token } : {};

async function api(path, opts = {}) {
  const res = await fetch(API + path, opts);
  if (!res.ok) {
    let msg = res.statusText;
    try {
      const data = await res.json();
      msg = data.detail || msg;
      if (Array.isArray(msg)) msg = msg.map(e => e.msg).join("; ");
    } catch {}
    throw new Error(msg);
  }
  if (res.status === 204) return null;
  return res.json();
}

// ==== AUTH ====
const authModal = $("authModal");
const authError = $("authError");
let registerMode = false;

$("authBtn").onclick = () => {
  if (token) {
    if (confirm("Выйти из аккаунта?")) {
      localStorage.removeItem("token");
      token = null; me = null;
      updateUI(); loadFeed();
    }
    return;
  }
  registerMode = false;
  syncAuthMode();
  authError.textContent = "";
  authModal.classList.add("open");
};

$("authSwitch").onclick = () => {
  registerMode = !registerMode;
  syncAuthMode();
  authError.textContent = "";
};

function syncAuthMode() {
  $("authTitle").textContent = registerMode ? "регистрация" : "вход";
  $("authSubmit").textContent = registerMode ? "создать" : "войти";
  $("authSwitch").textContent = registerMode ? "есть аккаунт → войти" : "нет аккаунта → регистрация";
}

$("authSubmit").onclick = async () => {
  const username = $("authUsername").value.trim();
  const password = $("authPassword").value;
  authError.textContent = "";

  if (!username || !password) {
    authError.textContent = "заполните все поля";
    return;
  }

  try {
    const endpoint = registerMode ? "/api/auth/register" : "/api/auth/login";
    const data = await api(endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    token = data.access_token;
    localStorage.setItem("token", token);
    me = data.user;
    authModal.classList.remove("open");
    $("authUsername").value = "";
    $("authPassword").value = "";
    updateUI();
    loadFeed();
  } catch (e) {
    authError.textContent = e.message;
  }
};

async function loadMe() {
  if (!token) return;
  try { me = await api("/api/auth/me", { headers: headers() }); }
  catch { token = null; localStorage.removeItem("token"); }
}

function updateUI() {
  $("authBtn").textContent = me ? "@" + me.username + " · выход" : "войти";
  $("uploadBtn").classList.toggle("hidden", !me);
  $("tabMine").classList.toggle("hidden", !me);
}

// ==== UPLOAD ====
const uploadModal = $("uploadModal");
const uploadError = $("uploadError");

$("uploadBtn").onclick = () => {
  uploadError.textContent = "";
  uploadModal.classList.add("open");
};

$("uploadSubmit").onclick = async () => {
  const file = $("memeFile").files[0];
  const caption = $("memeCaption").value;
  uploadError.textContent = "";

  if (!file) {
    uploadError.textContent = "выберите картинку";
    return;
  }

  const fd = new FormData();
  fd.append("file", file);
  fd.append("caption", caption);

  try {
    await api("/api/memes/", { method: "POST", headers: headers(), body: fd });
    uploadModal.classList.remove("open");
    $("memeFile").value = "";
    $("memeCaption").value = "";
    loadFeed();
  } catch (e) {
    uploadError.textContent = e.message;
  }
};

// ==== FEED ====
let currentTab = "all";

async function loadFeed() {
  const feed = $("feed");
  feed.innerHTML = "<div class='empty'>загрузка...</div>";
  try {
    const path = currentTab === "mine" ? "/api/memes/my" : "/api/memes/";
    const memes = await api(path, { headers: headers() });
    if (!memes.length) {
      feed.innerHTML = "<div class='empty'>пусто</div>";
      return;
    }
    feed.innerHTML = memes.map(m => `
      <div class="card" data-id="${m.id}">
        <div class="head">
          <span class="author">@${escapeHtml(m.author.username)}</span>
          <span>${fmtDate(m.created_at)}</span>
        </div>
        <img src="${m.image_url}" alt="" loading="lazy"/>
        ${m.caption ? `<div class="caption">${escapeHtml(m.caption)}</div>` : ""}
        <div class="actions">
          <button class="like ${m.liked_by_me ? "liked" : ""}" data-id="${m.id}">
            ${m.liked_by_me ? "★" : "☆"} ${m.likes_count}
          </button>
          ${me && m.author.username === me.username
            ? `<button class="delete" data-id="${m.id}">удалить</button>` : ""}
        </div>
      </div>
    `).join("");

    feed.querySelectorAll(".like").forEach(btn => {
      btn.onclick = async () => {
        if (!token) { $("authBtn").click(); return; }
        try {
          await api(`/api/memes/${btn.dataset.id}/like`, { method: "POST", headers: headers() });
          loadFeed();
        } catch (e) { alert(e.message); }
      };
    });

    feed.querySelectorAll(".delete").forEach(btn => {
      btn.onclick = async () => {
        if (!confirm("удалить мем?")) return;
        try {
          await api(`/api/memes/${btn.dataset.id}`, { method: "DELETE", headers: headers() });
          loadFeed();
        } catch (e) { alert(e.message); }
      };
    });
  } catch (e) {
    feed.innerHTML = `<div class="empty">ошибка: ${escapeHtml(e.message)}</div>`;
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
}

function fmtDate(iso) {
  const d = new Date(iso);
  const now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60) return "только что";
  if (diff < 3600) return Math.floor(diff/60) + " мин";
  if (diff < 86400) return Math.floor(diff/3600) + " ч";
  if (diff < 86400*7) return Math.floor(diff/86400) + " д";
  return d.toLocaleDateString("ru");
}

$("tabAll").onclick = () => {
  currentTab = "all";
  $("tabAll").classList.add("active");
  $("tabMine").classList.remove("active");
  loadFeed();
};
$("tabMine").onclick = () => {
  currentTab = "mine";
  $("tabMine").classList.add("active");
  $("tabAll").classList.remove("active");
  loadFeed();
};

// close modal on backdrop click
[authModal, uploadModal].forEach(m => {
  m.onclick = e => { if (e.target === m) m.classList.remove("open"); };
});

// init
(async () => {
  await loadMe();
  updateUI();
  loadFeed();
})();
</script>
</body>
</html>
